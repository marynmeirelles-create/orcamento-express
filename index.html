<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Orçamento Express</title>
  <meta name="theme-color" content="#FF7BAC">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Orçamento Express">
  <link rel="apple-touch-icon" href="/icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Poppins',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at top left,#FFF5F7 0%,#FFE4F0 40%,#F0EDFF 100%);}
    .card{width:100%;max-width:380px;background:#fff;border-radius:28px;padding:32px 26px 34px;box-shadow:0 14px 40px rgba(140,123,255,0.18);text-align:center;}
    .logo{width:140px;height:140px;object-fit:contain;margin-bottom:16px;border-radius:20px;}
    .logo-fallback{width:140px;height:140px;border-radius:20px;background:linear-gradient(135deg,#FF7BAC,#8C7BFF);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:48px;}
    h1{font-size:20px;font-weight:800;color:#8C7BFF;margin-bottom:4px;}
    p.sub{font-size:13px;color:#a08fc7;margin-bottom:24px;}
    label{display:block;text-align:left;font-size:12px;font-weight:600;color:#7a6c9f;margin-bottom:5px;}
    .pw-wrap{position:relative;margin-bottom:12px;}
    input[type=password],input[type=text]{width:100%;padding:12px 80px 12px 16px;border-radius:999px;border:1.5px solid #E8E8F3;font-family:'Poppins',sans-serif;font-size:14px;outline:none;transition:.2s;}
    input:focus{border-color:#FF7BAC;box-shadow:0 0 0 3px rgba(255,123,172,.15);}
    .toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:none;border-radius:999px;padding:5px 12px;font-size:11px;font-weight:600;cursor:pointer;background:#F0EDFF;color:#7a3a6b;font-family:'Poppins',sans-serif;}
    .lembrar{display:flex;align-items:center;gap:8px;font-size:12px;color:#7a6c9f;margin-bottom:16px;cursor:pointer;user-select:none;text-align:left;}
    .lembrar input{accent-color:#FF7BAC;width:15px;height:15px;flex-shrink:0;}
    .btn{width:100%;padding:13px;border:none;border-radius:999px;background:linear-gradient(90deg,#FF7BAC,#8C7BFF);color:#fff;font-family:'Poppins',sans-serif;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 4px 16px rgba(255,123,172,.35);}
    .btn-light{width:100%;padding:12px;border:none;border-radius:999px;background:#F0EDFF;color:#8C7BFF;font-family:'Poppins',sans-serif;font-size:13px;font-weight:700;cursor:pointer;margin-top:8px;}
    .link-btn{border:none;background:transparent;color:#8C7BFF;font-family:'Poppins',sans-serif;font-size:12px;font-weight:700;cursor:pointer;margin:2px 0 12px;text-decoration:underline;text-underline-offset:3px;}
    .reset-box{display:none;text-align:left;background:#FFF9FC;border:1px solid #F2EAF8;border-radius:18px;padding:14px;margin-top:14px;}
    .reset-title{font-size:13px;font-weight:800;color:#7a3a6b;margin-bottom:10px;text-align:center;}
    .reset-note{font-size:11px;color:#7a6c9f;line-height:1.45;margin:-2px 0 12px;text-align:center;}
    .erro{font-size:12px;color:#c73232;margin-top:10px;min-height:18px;}
    .ok{font-size:12px;color:#2d8a4e;margin-top:10px;min-height:18px;font-weight:700;}
  </style>
</head>
<body>
<div class="card">
  <img class="logo" src="/icon.png" alt="Orçamento Express"
    onerror="this.style.display='none';document.getElementById('logoFallback').style.display='flex'">
  <div class="logo-fallback" id="logoFallback" style="display:none">💌</div>
  <h1>Orçamento Express</h1>
  <p class="sub">Gere orçamentos e envie no WhatsApp</p>

  <div id="loginBox">
    <label for="senha">Senha de acesso</label>
    <div class="pw-wrap">
      <input type="password" id="senha" placeholder="Digite sua senha" autocomplete="new-password">
      <button class="toggle" type="button" id="toggle">Mostrar</button>
    </div>
    <label class="lembrar">
      <input type="checkbox" id="lembrar">
      Lembrar senha neste aparelho
    </label>
    <button class="link-btn" type="button" id="abrirReset">Esqueceu a senha? Redefinir senha</button>
    <button class="btn" id="entrar">Entrar</button>
    <p class="erro" id="erro"></p>
  </div>

  <div class="reset-box" id="resetBox">
    <div class="reset-title">Redefinir senha</div>
    <p class="reset-note">Informe o código de recuperação e crie uma nova senha.</p>
    <label for="codigoReset">Código de recuperação</label>
    <div class="pw-wrap">
      <input type="password" id="codigoReset" placeholder="Digite o código" autocomplete="one-time-code">
      <button class="toggle" type="button" id="toggleCodigo">Mostrar</button>
    </div>
    <label for="novaReset">Nova senha</label>
    <div class="pw-wrap">
      <input type="password" id="novaReset" placeholder="Mínimo 3 caracteres" autocomplete="new-password">
      <button class="toggle" type="button" id="toggleNova">Mostrar</button>
    </div>
    <label for="confirmaReset">Confirmar nova senha</label>
    <div class="pw-wrap">
      <input type="password" id="confirmaReset" placeholder="Repita a nova senha" autocomplete="new-password">
      <button class="toggle" type="button" id="toggleConfirma">Mostrar</button>
    </div>
    <button class="btn" type="button" id="salvarReset">Salvar nova senha</button>
    <button class="btn-light" type="button" id="cancelarReset">Voltar</button>
    <p class="erro" id="erroReset"></p>
    <p class="ok" id="okReset"></p>
  </div>
</div>
<script>
  const SENHA_PAD = "123";
  const K_SENHA   = "orc_senha";
  const K_AUTH    = "orc_auth";
  const K_LEMB    = "orc_lembrar";

  function getSenha(){
    return localStorage.getItem(K_SENHA) || SENHA_PAD;
  }

  const inp  = document.getElementById("senha");
  const chk  = document.getElementById("lembrar");
  const erro = document.getElementById("erro");
  const loginBox = document.getElementById("loginBox");
  const resetBox = document.getElementById("resetBox");

  if(localStorage.getItem(K_LEMB) === "1"){
    chk.checked = true;
    inp.value   = getSenha();
  }

  function toggleInput(id,btn){
    const input = document.getElementById(id);
    const show = input.type === "password";
    input.type = show ? "text" : "password";
    btn.textContent = show ? "Ocultar" : "Mostrar";
  }

  document.getElementById("toggle").onclick = function(){ toggleInput("senha", this); };
  document.getElementById("toggleCodigo").onclick = function(){ toggleInput("codigoReset", this); };
  document.getElementById("toggleNova").onclick = function(){ toggleInput("novaReset", this); };
  document.getElementById("toggleConfirma").onclick = function(){ toggleInput("confirmaReset", this); };

  document.getElementById("abrirReset").onclick = function(){
    erro.textContent = "";
    loginBox.style.display = "none";
    resetBox.style.display = "block";
    document.getElementById("codigoReset").focus();
  };

  document.getElementById("cancelarReset").onclick = function(){
    resetBox.style.display = "none";
    loginBox.style.display = "block";
    document.getElementById("erroReset").textContent = "";
    document.getElementById("okReset").textContent = "";
  };

  document.getElementById("entrar").onclick = entrar;
  inp.onkeydown = e => { if(e.key === "Enter") entrar(); };
  document.getElementById("salvarReset").onclick = redefinirSenha;

  function entrar(){
    const s = inp.value.trim();
    if(!s){ erro.textContent = "Digite a senha."; return; }
    if(s !== getSenha()){
      erro.textContent = "Senha incorreta.";
      return;
    }
    erro.textContent = "";
    if(chk.checked){
      localStorage.setItem(K_LEMB, "1");
    } else {
      localStorage.removeItem(K_LEMB);
    }
    localStorage.setItem(K_AUTH, "1");
    window.location.replace("/orcamento.html");
  }

  function redefinirSenha(){
    const codigo = document.getElementById("codigoReset").value.trim();
    const nova = document.getElementById("novaReset").value.trim();
    const confirma = document.getElementById("confirmaReset").value.trim();
    const erroReset = document.getElementById("erroReset");
    const okReset = document.getElementById("okReset");
    erroReset.textContent = "";
    okReset.textContent = "";
    if(!codigo || !nova || !confirma){ erroReset.textContent = "Preencha todos os campos."; return; }
    if(codigo !== SENHA_PAD){ erroReset.textContent = "Código de recuperação incorreto."; return; }
    if(nova.length < 3){ erroReset.textContent = "A senha precisa ter pelo menos 3 caracteres."; return; }
    if(nova !== confirma){ erroReset.textContent = "As senhas não coincidem."; return; }
    localStorage.setItem(K_SENHA, nova);
    localStorage.removeItem(K_AUTH);
    if(chk.checked){ inp.value = nova; }
    okReset.textContent = "Senha redefinida. Toque em Voltar para entrar.";
    document.getElementById("codigoReset").value = "";
    document.getElementById("novaReset").value = "";
    document.getElementById("confirmaReset").value = "";
  }
</script>
</body>
</html>
